<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./images/cloudy.png">
</head>
<body>
    <div class="main">
        <h1>Weather App</h1>
        <p id="demo">Enter the city, state and country of the location you wish to check e.g: London,England,GB</p>
        <div class="getWeatherInput">
            <input type="text" id="country">
            <button id="getWeather">Get Weather</button>
        </div>
    </div>

    <div class="results">
        <h1 id="city"></h1>
        <h1 id="temp"></h1>
        <p id="humidity"></p>
        <p id="weatherDesc"></p>
        <p id="weatherIcon"></p>
    </div>

    <script src="./app.js"></script>
</body>
</html>
